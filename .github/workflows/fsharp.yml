name: fsharp
on:
  push:
    branches: [main]
  pull_request:

# The bot commit that refreshes core/ needs to write to the pull request branch.
permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      # Check out the branch itself, not the merge commit, so a push goes back to the branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: F# tests
        run: dotnet run --project fsharp/tests --configuration Release
      - name: Install Fable
        run: |
          dotnet tool install --global fable --version "4.*"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Compile F# to JavaScript
        run: |
          fable --version
          fable fsharp/IpaTrombone.fsproj --outDir core
      - name: JavaScript tests
        env:
          CI: "true"
        run: npm test
      # core/ is committed so the site stays static. Pull requests from this repository get the
      # regenerated files pushed to their branch. Never main: main only checks.
      - name: Push regenerated core/ to the pull request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add -f -A core
          if git diff --cached --quiet; then
            echo "core/ is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate core/ from the F# source"
          git push
      - name: Check core/ matches the F# source
        if: github.event_name == 'push'
        run: |
          git add -f -N core
          git diff --exit-code -- core
