<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>ipa-pink-trombone</title>
<meta content="IPA to mouth lessons: incremental experiments with a Pink-Trombone-style vocal tract." data-i18n-attr="content:home.meta1" name="description"/>
<link href="/css/site.css" rel="stylesheet"/>
</head>
<body>
<nav class="top"><strong>ipa-pink-trombone</strong>
<a href="https://github.com/juanmichelini/ipa-pink-trombone">GitHub</a>
<a data-i18n="home.a1" href="/literate/?src=lib/literate.js">Read the source</a>
</nav>
<h1 data-i18n="home.h11">IPA to mouth lessons</h1>
<p data-i18n-html="home.p2">Inspired by <a href="https://dood.al/pinktrombone/">Pink Trombone</a> by Neil Thapen.
     Click an IPA symbol, watch a vocal tract move, hear what comes out.</p>
<ul class="grid" id="demos"></ul>
<script type="module">
    import { demos } from '/lib/demos.js';
    import { t } from '/lib/i18n.js';
    const list = document.getElementById('demos');
    for (const d of demos) {
      const live = d.status === 'live';
      const li = document.createElement('li');
      const el = document.createElement(live ? 'a' : 'div');
      el.className = 'card';
      if (live) el.href = `/demos/${d.slug}/`;
      el.innerHTML =
        `<span class="pill ${live ? 'live' : ''}">${t(live ? 'home.live' : 'home.planned')}</span>` +
        `<span class="n">${t('home.demo', { n: d.n })}</span><h3></h3><p></p>`;
      el.querySelector('h3').textContent = t(`demo.${d.n}.title`, {}, d.title);
      el.querySelector('p').textContent = t(`demo.${d.n}.blurb`, {}, d.blurb);
      li.append(el);
      list.append(li);
    }
  </script>
</body>
</html>
