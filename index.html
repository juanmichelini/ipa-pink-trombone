<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>🗣️ Speaking Head</title>
<meta content="A speaking head: type IPA or a word and watch a simulated vocal tract say it, in ten languages, voices, tempos and accents." data-i18n-attr="content:home.meta1" name="description"/>
<link href="/css/site.css" rel="stylesheet"/>
</head>
<body>
<nav class="top"><strong>🗣️ Speaking Head</strong>
<a href="https://github.com/juanmichelini/speaking-head">GitHub</a>
<a data-i18n="home.a1" href="/literate/?src=lib/literate.js">Read the source</a>
</nav>
<h1>🗣️ Speaking Head</h1>
<p class="tagline" data-i18n="home.h11">IPA to mouth lessons</p>
<p data-i18n="home.p2">Click an IPA symbol, watch a vocal tract move, hear what comes out.</p>
<ul class="grid" id="demos"></ul>
<p class="seealso" data-i18n-html="home.seealso">See also: <a href="https://dood.al/pinktrombone/">Pink Trombone</a> by Neil Thapen, the browser vocal-tract synthesizer that started this.</p>
<script type="module">
    import { lessons, stepsOf } from '/lib/demos.js';
    import { t } from '/lib/i18n.js';
    const list = document.getElementById('demos');
    for (const d of lessons) {
      const live = d.status === 'live';
      const li = document.createElement('li');
      const el = document.createElement(live ? 'a' : 'div');
      el.className = 'card';
      if (live) el.href = `/demos/${d.slug}/`;
      el.innerHTML =
        `<span class="pill ${live ? 'live' : ''}">${t(live ? 'home.live' : 'home.planned')}</span>` +
        `<span class="n">${t('home.demo', { n: d.n })}</span><h3></h3><p></p>`;
      el.querySelector('h3').textContent = t(`demo.${d.n}.title`, {}, d.title);
      el.querySelector('p').textContent = t(`demo.${d.n}.blurb`, {}, d.blurb);
      li.append(el);
      // The steps that lead up to this lesson, one dimension at a time.
      const steps = stepsOf(d.n).filter((x) => x.status === 'live');
      if (steps.length) {
        const row = document.createElement('div');
        row.className = 'steps';
        row.append(`${t('lesson.steps', {}, 'Step by step:')} `);
        for (const step of steps) {
          const a = document.createElement('a');
          a.href = `/demos/${step.slug}/`;
          a.textContent = step.n;
          a.title = t(`demo.${step.n}.title`, {}, step.title);
          a.setAttribute('aria-label', `${step.n} ${a.title}`);
          row.append(a, ' ');
        }
        li.append(row);
      }
      list.append(li);
    }
  </script>
</body>
</html>
